name: Build Totem OS ISO
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Gerar ISO do Totem
        run: bash build_iso.sh
      - uses: actions/upload-artifact@v4
        with:
          name: totem-os-iso
          path: totem-os.iso
          compression-level: 0
