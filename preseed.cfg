# Instalacao automatica e OFFLINE do Totem OS (Debian 12 netinst remasterizado)
d-i debian-installer/locale string pt_BR.UTF-8
d-i debian-installer/language string pt
d-i debian-installer/country string BR
d-i keyboard-configuration/xkb-keymap select br
d-i console-setup/ask_detect boolean false

# Sem rede durante a instalacao (tudo vem da ISO)
d-i netcfg/enable boolean false
d-i netcfg/get_hostname string totem
d-i netcfg/get_domain string local
d-i hw-detect/load_firmware boolean false
d-i apt-setup/use_mirror boolean false
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true

d-i clock-setup/utc boolean true
d-i time/zone string America/Fortaleza
d-i clock-setup/ntp boolean false

# Usuario (troque a senha depois com o comando passwd)
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Administrador
d-i passwd/username string admin
d-i passwd/user-password password admin1234
d-i passwd/user-password-again password admin1234
d-i user-setup/allow-password-weak boolean true

# Particionamento: guiado, disco inteiro. O instalador SEMPRE pede confirmacao
# antes de gravar no disco (nao pre-respondemos partman/confirm de proposito).
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish

# Sem tarefas extras (o totem e instalado no late_command)
d-i pkgsel/run_tasksel boolean false
tasksel tasksel/first multiselect
d-i pkgsel/upgrade select none
d-i popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default
d-i grub-installer/force-efi-extra-removable boolean true
d-i debian-installer/add-kernel-opts string quiet loglevel=0 consoleblank=0 mitigations=off

# Instala o totem a partir da propria ISO
d-i preseed/late_command string \
  mkdir -p /target/opt/totem-repo /target/opt/totem-app-src ; \
  cp -r /cdrom/totem/repo/. /target/opt/totem-repo/ ; \
  cp -r /cdrom/totem/app/. /target/opt/totem-app-src/ ; \
  cp /cdrom/totem/instalar_offline.sh /target/root/instalar_offline.sh ; \
  in-target bash /root/instalar_offline.sh

d-i cdrom-detect/eject boolean true
d-i finish-install/reboot_in_progress note
